[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zerion-genesis"
version = "5.0.0"
description = "ZERION-X Ω — Self-Developing Intelligence Runtime & Intelligence Foundry Substrate"
readme = "README.md"
authors = [{ name = "Zerion Autonomous Engineering Collective", email = "dev@zerion.ai" }]
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
dependencies = []
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Android",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows"
]

[project.optional-dependencies]
openai = [
    "openai>=1.0.0",
    "httpx>=0.25.0",
]
local_llm = [
    "llama-cpp-python>=0.2.0",
]
audio = [
    "sounddevice>=0.4.6",
    "numpy>=1.24.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]
all = [
    "openai>=1.0.0",
    "httpx>=0.25.0",
    "llama-cpp-python>=0.2.0",
    "sounddevice>=0.4.6",
    "numpy>=1.24.0",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]

[project.scripts]
zerion = "zerion.cli:main"
genesis = "zerion.cli:main"
zerion-ui = "zerion.ui.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["zerion", "zerion.*"]

[tool.setuptools.package-data]
zerion = ["ui/*.html", "ui/*.css", "ui/*.js"]
