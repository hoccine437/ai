<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zerion AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #09090b;
            --panel-bg: #18181b;
            --accent: #71717a;
            --text-main: #ffffff;
            --text-sub: #a1a1aa;
            --input-bg: #27272a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 700px;
            height: 90vh;
            background: var(--panel-bg);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid #27272a;
        }

        /* Header */
        header {
            padding: 20px;
            border-bottom: 1px solid #27272a;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo {
            font-weight: 600;
            letter-spacing: 2px;
            font-size: 1.2rem;
            color: var(--text-main);
        }

        .status {
            font-size: 0.75rem;
            color: var(--text-sub);
            margin-left: auto;
        }

        .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #22c55e;
            margin-right: 5px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Chat Window */
        .chat-window {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            padding: 12px 16px;
            border-radius: 12px;
            max-width: 80%;
            font-size: 0.95rem;
            line-height: 1.5;
            word-wrap: break-word;
        }

        .message.ai {
            background: #27272a;
            align-self: flex-start;
        }

        .message.user {
            background: #3f3f46;
            align-self: flex-end;
        }

        .thinking {
            color: var(--text-sub);
            font-style: italic;
            font-size: 0.85rem;
            align-self: flex-start;
            padding: 8px 16px;
        }

        /* Bottom Input Section */
        .input-area {
            padding: 20px;
            background: var(--panel-bg);
            border-top: 1px solid #27272a;
        }

        .input-wrapper {
            display: flex;
            background: var(--input-bg);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #3f3f46;
        }

        input {
            flex: 1;
            background: transparent;
            border: none;
            padding: 15px;
            color: white;
            outline: none;
            font-size: 0.95rem;
        }

        input::placeholder {
            color: var(--text-sub);
        }

        button {
            background: #71717a;
            border: none;
            color: white;
            padding: 0 20px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }

        button:hover {
            background: #a1a1aa;
        }

        button:disabled {
            background: #3f3f46;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div class="logo">ZERION</div>
            <div class="status">
                <span class="status-dot" id="statusDot"></span>
                <span id="statusText">Connecting...</span>
            </div>
        </header>

        <div class="chat-window" id="chat">
            <div class="message ai">Hello, I am Zerion. How can I assist you today?</div>
        </div>

        <div class="input-area">
            <div class="input-wrapper">
                <input type="text" id="userInput" placeholder="Type your message here..." onkeydown="if(event.key==='Enter') sendMessage()">
                <button id="sendBtn" onclick="sendMessage()">Send</button>
            </div>
        </div>
    </div>

    <script>
        const chat = document.getElementById('chat');
        const input = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        let isProcessing = false;

        // Check backend status on load
        fetch('/api/status')
            .then(r => r.json())
            .then(data => {
                statusDot.style.background = '#22c55e';
                statusText.textContent = 'Online';
            })
            .catch(() => {
                statusDot.style.background = '#ef4444';
                statusText.textContent = 'Offline';
            });

        function sendMessage() {
            const text = input.value.trim();
            if (text === "" || isProcessing) return;

            isProcessing = true;
            sendBtn.disabled = true;

            // Add User Message
            const userMsg = document.createElement('div');
            userMsg.className = 'message user';
            userMsg.textContent = text;
            chat.appendChild(userMsg);

            // Clear Input
            input.value = "";
            chat.scrollTop = chat.scrollHeight;

            // Show thinking indicator
            const thinking = document.createElement('div');
            thinking.className = 'thinking';
            thinking.textContent = 'Zerion is thinking...';
            chat.appendChild(thinking);
            chat.scrollTop = chat.scrollHeight;

            // Send to ZERION backend
            fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: text })
            })
            .then(r => r.json())
            .then(data => {
                thinking.remove();
                const aiMsg = document.createElement('div');
                aiMsg.className = 'message ai';
                aiMsg.textContent = data.reply || data.output || data.response || "I'm not sure how to respond to that.";
                chat.appendChild(aiMsg);
                chat.scrollTop = chat.scrollHeight;
            })
            .catch(err => {
                thinking.remove();
                const aiMsg = document.createElement('div');
                aiMsg.className = 'message ai';
                aiMsg.textContent = "Connection error. Make sure ZERION backend is running.";
                chat.appendChild(aiMsg);
                chat.scrollTop = chat.scrollHeight;
            })
            .finally(() => {
                isProcessing = false;
                sendBtn.disabled = false;
                input.focus();
            });
        }
    </script>

</body>
</html>
