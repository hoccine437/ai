<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#09090b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>ZERION AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #09090b;
            --panel-bg: #18181b;
            --accent: #71717a;
            --text-main: #ffffff;
            --text-sub: #a1a1aa;
            --input-bg: #27272a;
            --gemini-blue: #4285f4;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            overscroll-behavior: none;
        }

        .container {
            width: 100%;
            max-width: 700px;
            height: 100dvh;
            background: var(--panel-bg);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Header */
        header {
            padding: 16px 20px;
            border-bottom: 1px solid #27272a;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo {
            font-weight: 600;
            letter-spacing: 2px;
            font-size: 1.1rem;
            color: var(--text-main);
        }

        .model-badge {
            font-size: 0.65rem;
            color: var(--gemini-blue);
            background: rgba(66, 133, 244, 0.1);
            padding: 2px 8px;
            border-radius: 10px;
            border: 1px solid rgba(66, 133, 244, 0.3);
        }

        .status {
            font-size: 0.75rem;
            color: var(--text-sub);
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #22c55e;
            animation: pulse 2s infinite;
        }

        .status-dot.offline {
            background: #ef4444;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Chat Window */
        .chat-window {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            scroll-behavior: smooth;
        }

        .message {
            padding: 10px 14px;
            border-radius: 12px;
            max-width: 85%;
            font-size: 0.95rem;
            line-height: 1.5;
            word-wrap: break-word;
            white-space: pre-wrap;
        }

        .message.ai {
            background: #27272a;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .message.user {
            background: #3f3f46;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .thinking {
            color: var(--text-sub);
            font-style: italic;
            font-size: 0.85rem;
            align-self: flex-start;
            padding: 8px 14px;
        }

        .info-bar {
            font-size: 0.7rem;
            color: var(--text-sub);
            text-align: center;
            padding: 4px;
        }

        /* Bottom Input Section */
        .input-area {
            padding: 12px 16px;
            padding-bottom: max(12px, env(safe-area-inset-bottom));
            background: var(--panel-bg);
            border-top: 1px solid #27272a;
        }

        .input-wrapper {
            display: flex;
            background: var(--input-bg);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #3f3f46;
        }

        input {
            flex: 1;
            background: transparent;
            border: none;
            padding: 14px;
            color: white;
            outline: none;
            font-size: 16px; /* Prevents Android zoom */
        }

        input::placeholder {
            color: var(--text-sub);
        }

        button {
            background: var(--accent);
            border: none;
            color: white;
            padding: 0 18px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            transition: background 0.2s;
            min-width: 44px;
            min-height: 44px;
        }

        button:hover {
            background: #a1a1aa;
        }

        button:disabled {
            background: #3f3f46;
            cursor: not-allowed;
        }

        @media (max-width: 480px) {
            header { padding: 12px 16px; }
            .chat-window { padding: 12px; }
            .input-area { padding: 10px 12px; padding-bottom: max(10px, env(safe-area-inset-bottom)); }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div class="logo">ZERION</div>
            <div class="model-badge">gemini-2.5-flash</div>
            <div class="status">
                <div class="status-dot" id="statusDot"></div>
                <span id="statusText">Connecting...</span>
            </div>
        </header>

        <div class="chat-window" id="chat">
            <div class="info-bar">ZERION — 21 agents · 100 tools · Powered by Gemini 2.5 Flash</div>
            <div class="message ai">Hello, I am Zerion. How can I assist you today?</div>
        </div>

        <div class="input-area">
            <div class="input-wrapper">
                <input type="text" id="userInput" placeholder="Talk to Zerion..."
                       onkeydown="if(event.key==='Enter') sendMessage()">
                <button id="sendBtn" onclick="sendMessage()">Send</button>
            </div>
        </div>
    </div>

    <script>
        const chat = document.getElementById('chat');
        const input = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        let isProcessing = false;

        // Check backend status
        fetch('/api/status')
            .then(r => r.json())
            .then(data => {
                statusDot.classList.remove('offline');
                statusText.textContent = 'Online';
            })
            .catch(() => {
                statusDot.classList.add('offline');
                statusText.textContent = 'Offline';
            });

        function sendMessage() {
            const text = input.value.trim();
            if (text === "" || isProcessing) return;

            isProcessing = true;
            sendBtn.disabled = true;

            // User message
            const userMsg = document.createElement('div');
            userMsg.className = 'message user';
            userMsg.textContent = text;
            chat.appendChild(userMsg);

            input.value = "";
            chat.scrollTop = chat.scrollHeight;

            // Thinking indicator
            const thinking = document.createElement('div');
            thinking.className = 'thinking';
            thinking.textContent = 'Zerion is thinking...';
            chat.appendChild(thinking);
            chat.scrollTop = chat.scrollHeight;

            // Send to backend
            fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: text })
            })
            .then(r => r.json())
            .then(data => {
                thinking.remove();
                const aiMsg = document.createElement('div');
                aiMsg.className = 'message ai';
                aiMsg.textContent = data.reply || data.output || data.response || "I'm not sure how to respond to that.";
                chat.appendChild(aiMsg);
                chat.scrollTop = chat.scrollHeight;
            })
            .catch(err => {
                thinking.remove();
                const aiMsg = document.createElement('div');
                aiMsg.className = 'message ai';
                aiMsg.textContent = "Connection error. Make sure ZERION backend is running on port 8080.";
                chat.appendChild(aiMsg);
                chat.scrollTop = chat.scrollHeight;
            })
            .finally(() => {
                isProcessing = false;
                sendBtn.disabled = false;
                input.focus();
            });
        }
    </script>

</body>
</html>
